# Gzip compression
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 6;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
  listen 80;
  server_name samlogistic.tn www.samlogistic.tn;
  root /usr/share/nginx/html;
  index index.html;

  # Redirect HTTP to HTTPS (uncomment when SSL is configured)
  # return 301 https://$host$request_uri;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  types {
    application/vnd.android.package-archive apk;
  }

  # Security headers
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://api.samlogistic.tn;" always;

  # Hide nginx version
  server_tokens off;

  # Prevent direct access to hidden files
  location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
  }

  # SPA index.html - no cache
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    try_files $uri =404;
  }

  # Static assets - long cache
  location /assets/ {
    limit_req zone=general burst=50 nodelay;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # APK files
  location ~* \.(apk)$ {
    add_header Content-Type application/vnd.android.package-archive;
    add_header Content-Disposition "attachment; filename=$uri";
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  # API proxy to backend with rate limiting
  location / {
    limit_req zone=api burst=40 nodelay;
    try_files $uri $uri/ /index.html;
  }
}
